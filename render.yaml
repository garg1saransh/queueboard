# Render Blueprint — Queueboard
# Docs: https://render.com/docs/infrastructure-as-code
#
# Free web + free Postgres + free Key Value (Redis-compatible).
# Background workers cannot use the Free plan — Starter is required (~$7/mo).
#
# After first deploy:
# 1. Copy the web service URL
# 2. Set NEXT_PUBLIC_APP_URL on web + worker to that URL
# 3. Redeploy web (and worker)

databases:
  - name: queueboard-db
    plan: free
    databaseName: async_job_queue
    user: queueboard

services:
  - type: keyvalue
    name: queueboard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: queueboard-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queueboard-redis
          type: keyvalue
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PORT
        value: "10000"

  - type: worker
    name: queueboard-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx worker/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queueboard-redis
          type: keyvalue
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
