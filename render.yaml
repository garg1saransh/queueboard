# Render Blueprint — Queueboard (fully free)
# https://dashboard.render.com/blueprints
#
# Creates free Postgres + free Key Value (Redis-compatible) + free web service.
# The BullMQ worker runs in-process on the web service (RUN_WORKER_IN_WEB=true)
# because Render Free cannot host a separate background worker.
#
# Locally, prefer separate processes: npm run dev:all
#
# After first deploy:
# 1. Copy the web URL (e.g. https://queueboard-web.onrender.com)
# 2. Set NEXT_PUBLIC_APP_URL to that URL on the web service
# 3. Redeploy the web service

databases:
  - name: queueboard-db
    plan: free
    databaseName: async_job_queue
    user: queueboard

services:
  - type: keyvalue
    name: queueboard-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off

  - type: web
    name: queueboard-web
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_WEB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: queueboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queueboard-redis
          type: keyvalue
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PORT
        value: "10000"
