# Render Blueprint — Queueboard
# https://dashboard.render.com/blueprints
#
# Creates:
# - Web service (Next.js + Socket.IO via server.ts)
# - Worker service (BullMQ consumer)
# - PostgreSQL
# - Redis
#
# After first deploy, set NEXT_PUBLIC_APP_URL to your web service URL
# and redeploy the web service once.

databases:
  - name: queueboard-db
    plan: free
    databaseName: async_job_queue
    user: queueboard

services:
  - type: redis
    name: queueboard-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: queueboard-web
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queueboard-redis
          type: redis
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: PORT
        value: "10000"

  - type: worker
    name: queueboard-worker
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx tsx worker/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: queueboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: queueboard-redis
          type: redis
          property: connectionString
      - key: NEXT_PUBLIC_APP_URL
        sync: false
